<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | 制作中</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .coming-soon-panel {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem;
      background: color-mix(in oklab, var(--panel) 78%, transparent);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(6px);
    }

    .coming-soon-badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      background: color-mix(in oklab, var(--brand) 18%, transparent);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .coming-soon-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.15;
      margin: 0 0 1rem;
      color: #fff;
    }

    .coming-soon-text {
      margin: 0 auto 1.25rem;
      max-width: 38rem;
      color: #e5e7eb;
      font-size: 1rem;
    }

    .hero-cta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .hero-cta .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: color-mix(in oklab, var(--surface) 78%, transparent);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .hero-cta .icon:hover {
      transform: translateY(-2px);
      background: color-mix(in oklab, var(--brand) 20%, transparent);
    }

    .hero-cta .icon img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }

    .status-note {
      margin-top: 1rem;
      font-size: 0.92rem;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand">
        <span class="brand-text">Koh Portfolio</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div class="coming-soon-panel">
          <p class="coming-soon-badge">Now Building</p>
          <h1 class="coming-soon-title">ポートフォリオサイトは現在制作中です</h1>
          <p class="coming-soon-text">
            ご覧いただきありがとうございます。<br>
            作品紹介・プロフィール・制作実績を順次追加しています。<br>
            公開まで、もう少しお待ちください。
          </p>

          <div class="hero-cta">
            <a class="icon" href="https://www.instagram.com/ko25874/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <img src="assets/Instagram_Glyph_White.png" alt="Instagram">
            </a>
            <a class="icon" href="https://x.com/Ko25874" target="_blank" rel="noopener noreferrer" aria-label="X">
              <img src="assets/logo-white.png" alt="X">
            </a>
          </div>

          <p class="status-note">
            ※ 現在、デザイン・作品整理・テキスト調整を進行中です。
          </p>
        </div>
      </div>

      <div class="scroll-cue">Coming Soon</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>&copy; 2026 Koh Portfolio</small>
    </div>
  </footer>
</body>
</html>
